<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Health Atlas Animation Test</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #161a23;
      --ink: #dce3f3;
      --accent: #ff1b00;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1b2130 0%, var(--bg) 55%);
      color: var(--ink);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
    }

    .panel {
      width: min(720px, 100%);
      background: linear-gradient(180deg, #1a2030 0%, var(--panel) 70%);
      border: 1px solid #293043;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 22px 80px rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.2rem;
      font-weight: 620;
      letter-spacing: 0.01em;
    }

    p {
      margin: 0;
      color: #9aa7c2;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .stage {
      margin-top: 18px;
      border-radius: 14px;
      border: 1px solid #252d41;
      background: linear-gradient(145deg, #131826 0%, #0d111b 100%);
      padding: 20px;
      display: grid;
      place-items: center;
    }

    .stage svg {
      width: min(420px, 92vw);
      height: auto;
      overflow: visible;
    }

    #apart-layer path {
      transform-box: fill-box;
      transform-origin: center;
      will-change: transform, d;
    }

    #final-layer {
      visibility: hidden;
      pointer-events: none;
    }

    .controls {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .hint {
      color: #8b96af;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Health Atlas Lottie-Style Test</h1>
    <p>
      Isolated animation test: starts with the exploded <code>health_atlas_apart.svg</code>
      geometry and resolves into the final <code>health_atlas.svg</code> mark.
    </p>

    <div class="stage">
      <svg id="stage-svg" viewBox="0 0 252 299" xmlns="http://www.w3.org/2000/svg" aria-label="Health Atlas assembly animation">
        <g id="apart-layer">
          <path d="M199 217H241.44V246.233C241.44 253.527 235.527 259.44 228.233 259.44H199V217Z" fill="#FF1B00"/>
          <path d="M198.797 83.7632L198.797 41.3233L228.031 41.3233C235.325 41.3233 241.237 47.236 241.237 54.5298L241.237 83.7632L198.797 83.7632Z" fill="#FF1B00"/>
          <path d="M125.831 128.437L125.831 40.5784L155.064 40.5784C162.358 40.5784 168.271 46.4912 168.271 53.785L168.271 128.437L125.831 128.437Z" fill="#FF1B00"/>
          <path d="M97.5374 255.756H55.0974V284.99C55.0974 292.283 61.0102 298.196 68.304 298.196H97.5374V255.756Z" fill="#FF1B00"/>
          <path d="M51.0024 83.0186H6.74725e-05V112.252C6.74725e-05 119.546 5.91286 125.458 13.2067 125.458H51.0024V83.0186Z" fill="#FF1B00"/>
          <path d="M101.633 83.0186L101.633 9.01222e-05L64.2091 8.9676e-05C56.9153 8.9589e-05 51.0025 5.91288 51.0025 13.2067L51.0025 83.0186L101.633 83.0186Z" fill="#FF1B00"/>
          <path d="M251.289 128.437L168.271 128.437L168.271 165.86C168.271 173.154 174.184 179.067 181.477 179.067L251.289 179.067L251.289 128.437Z" fill="#FF1B00"/>
          <path d="M101.633 173.11L18.6141 173.11L18.6141 210.534C18.6141 217.828 24.5269 223.74 31.8207 223.74L101.633 223.74L101.633 173.11Z" fill="#FF1B00"/>
          <path d="M101.633 83.0186L101.633 173.11L113.741 173.11C121.035 173.11 126.948 167.198 126.948 159.904L126.948 83.0186L101.633 83.0186Z" fill="#FF1B00"/>
          <path d="M168.271 259.479L168.271 171.994L140.154 171.994C132.861 171.994 126.948 177.906 126.948 185.2L126.948 259.479L168.271 259.479Z" fill="#FF1B00"/>
        </g>

        <!-- Final icon scaled/centered inside the exploded-artboard; used as morph target geometry -->
        <g id="final-layer">
          <g transform="translate(77.36 100.62) scale(0.572)">
            <path d="M83.0186 87L9.01222e-05 87L9.33939e-05 124.424C9.40315e-05 131.717 5.91288 137.63 13.2067 137.63L83.0186 137.63L83.0186 87Z" fill="#FF1B00"/>
            <path d="M82.6301 83.0186L82.6301 9.01222e-05L45.2066 8.9676e-05C37.9128 8.9589e-05 32 5.91288 32 13.2067L32 83.0186L82.6301 83.0186Z" fill="#FF1B00"/>
            <path d="M87 82.6299H170.018V45.2064C170.018 37.9126 164.106 31.9998 156.812 31.9998L87 31.9998V82.6299Z" fill="#FF1B00"/>
            <path d="M87 87L87 170.018L124.424 170.018C131.717 170.018 137.63 164.106 137.63 156.812L137.63 87L87 87Z" fill="#FF1B00"/>
          </g>
        </g>
      </svg>
    </div>

    <div class="controls">
      <button id="replay-btn" type="button">Replay</button>
      <label class="hint"><input id="loop-checkbox" type="checkbox" checked /> Loop</label>
    </div>
  </main>

  <script>
    const svg = document.getElementById("stage-svg");
    const apartLayer = document.getElementById("apart-layer");
    const finalLayer = document.getElementById("final-layer");
    const replayBtn = document.getElementById("replay-btn");
    const loopCheckbox = document.getElementById("loop-checkbox");
    const apartPaths = Array.from(apartLayer.querySelectorAll("path"));
    const finalPaths = Array.from(finalLayer.querySelectorAll("path"));

    const stageCenter = { x: 126, y: 149.5 };
    const SAMPLE_POINTS = 96;
    const START_LAYOUT_SCALE = 0.68;

    function clamp01(value) {
      return Math.min(1, Math.max(0, value));
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function easeOutSine(t) {
      return Math.sin((t * Math.PI) / 2);
    }

    function pathCenterFromBox(path) {
      const box = path.getBBox();
      return { x: box.x + box.width / 2, y: box.y + box.height / 2 };
    }

    function translatePoints(points, dx, dy) {
      return points.map((point) => ({ x: point.x + dx, y: point.y + dy }));
    }

    function scalePointsAround(points, scale, center) {
      return points.map((point) => ({
        x: center.x + (point.x - center.x) * scale,
        y: center.y + (point.y - center.y) * scale
      }));
    }

    function samplePathPointsInSvg(path, count) {
      const points = [];
      const length = path.getTotalLength();
      const matrix = path.getCTM();
      const svgPoint = svg.createSVGPoint();

      for (let i = 0; i < count; i += 1) {
        const t = i / (count - 1);
        const sample = path.getPointAtLength(length * t);
        svgPoint.x = sample.x;
        svgPoint.y = sample.y;
        const out = matrix ? svgPoint.matrixTransform(matrix) : { x: sample.x, y: sample.y };
        points.push({ x: out.x, y: out.y });
      }

      return points;
    }

    function pointsToPathD(points) {
      if (!points.length) return "";
      const [first, ...rest] = points;
      const head = `M${first.x.toFixed(3)} ${first.y.toFixed(3)}`;
      const body = rest.map((point) => `L${point.x.toFixed(3)} ${point.y.toFixed(3)}`).join("");
      return `${head}${body}Z`;
    }

    function interpolatePoints(from, to, t) {
      return from.map((point, idx) => ({
        x: point.x + (to[idx].x - point.x) * t,
        y: point.y + (to[idx].y - point.y) * t
      }));
    }

    function buildBalancedAssignments(pathCenters, targetCenters) {
      const byAngle = pathCenters
        .map((center, idx) => {
          const angle = Math.atan2(center.y - stageCenter.y, center.x - stageCenter.x);
          return { idx, angle };
        })
        .sort((a, b) => a.angle - b.angle);

      const targetOrder = targetCenters
        .map((center, idx) => {
          const angle = Math.atan2(center.y - stageCenter.y, center.x - stageCenter.x);
          return { idx, angle };
        })
        .sort((a, b) => a.angle - b.angle)
        .map((entry) => entry.idx);

      const assignments = new Array(pathCenters.length).fill(0);
      const groups = targetCenters.map(() => []);

      byAngle.forEach((entry, orderIndex) => {
        const targetIndex = targetOrder[orderIndex % targetOrder.length];
        assignments[entry.idx] = targetIndex;
        groups[targetIndex].push(entry.idx);
      });

      return { assignments, groups };
    }

    function buildModel() {
      const targetPointSets = finalPaths.map((path) => samplePathPointsInSvg(path, SAMPLE_POINTS));
      const targetCenters = finalPaths.map((path) => pathCenterFromBox(path));
      const pathCenters = apartPaths.map((path) => pathCenterFromBox(path));
      const { assignments, groups } = buildBalancedAssignments(pathCenters, targetCenters);

      return apartPaths.map((path, idx) => {
        const targetIndex = assignments[idx];
        const sourcePointsRaw = samplePathPointsInSvg(path, SAMPLE_POINTS);
        const sourcePoints = scalePointsAround(sourcePointsRaw, START_LAYOUT_SCALE, stageCenter);
        const targetPoints = targetPointSets[targetIndex];
        const group = groups[targetIndex];
        const slot = group.indexOf(idx);
        const spreadRadius = 8 + group.length * 3;
        const spreadAngle = (Math.PI * 2 * slot) / Math.max(1, group.length) + (idx * 0.2);
        const spreadPoints = translatePoints(
          targetPoints,
          Math.cos(spreadAngle) * spreadRadius,
          Math.sin(spreadAngle) * spreadRadius
        );

        return {
          sourcePoints,
          spreadPoints,
          targetPoints,
          sourceD: pointsToPathD(sourcePoints),
          morphDelay: idx * 36
        };
      });
    }

    const model = buildModel();
    let loopTimer = null;

    function resetState() {
      apartPaths.forEach((path, idx) => {
        const m = model[idx];
        path.style.transition = "none";
        path.style.opacity = "1";
        path.setAttribute("d", m.sourceD);
        path.style.transform = "none";
      });
    }

    function runMorph() {
      const startAt = performance.now();
      const durationMs = 1560;
      const tailDelay = model[model.length - 1].morphDelay;
      const spreadPhaseRatio = 0.62;

      function tick(now) {
        let active = false;

        apartPaths.forEach((path, idx) => {
          const m = model[idx];
          const raw = (now - startAt - m.morphDelay) / durationMs;
          const clamped = clamp01(raw);
          if (raw < 0) {
            active = true;
            return;
          }
          const eased = easeInOutCubic(clamped);
          const points = eased < spreadPhaseRatio
            ? interpolatePoints(
              m.sourcePoints,
              m.spreadPoints,
              easeInOutCubic(eased / spreadPhaseRatio)
            )
            : (() => {
              const phaseT = (eased - spreadPhaseRatio) / (1 - spreadPhaseRatio);
              const settleCutoff = 0.84;
              const settleStartBlend = 0.94;

              const blend = phaseT < settleCutoff
                ? settleStartBlend * easeOutCubic(phaseT / settleCutoff)
                : settleStartBlend + (1 - settleStartBlend) * easeOutSine(
                  (phaseT - settleCutoff) / (1 - settleCutoff)
                );

              return interpolatePoints(m.spreadPoints, m.targetPoints, blend);
            })();
          path.setAttribute("d", pointsToPathD(points));

          if (raw < 1) {
            active = true;
          }
        });

        if (active) {
          requestAnimationFrame(tick);
        }
      }

      requestAnimationFrame(tick);

      if (loopCheckbox.checked) {
        loopTimer = window.setTimeout(play, durationMs + tailDelay + 1900);
      }
    }

    function play() {
      window.clearTimeout(loopTimer);
      resetState();

      window.setTimeout(() => {
        runMorph();
      }, 320);
    }

    replayBtn.addEventListener("click", play);
    loopCheckbox.addEventListener("change", () => {
      if (loopCheckbox.checked) {
        play();
      } else {
        window.clearTimeout(loopTimer);
      }
    });

    play();
  </script>
</body>
</html>
