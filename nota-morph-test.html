<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nota Morph Test</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#0d1018;
      --panel:#171d2b;
      --ink:#dbe3f5;
      --muted:#95a3c2;
      --accent:#ff1b00;
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      background:radial-gradient(circle at top,#1a2238 0%,var(--bg) 56%);
      color:var(--ink);
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    .panel{
      width:min(760px,100%);
      border:1px solid #2a3550;
      border-radius:18px;
      background:linear-gradient(180deg,#1c2436 0%,var(--panel) 72%);
      box-shadow:0 20px 72px rgba(0,0,0,0.45);
      padding:22px;
    }
    h1{
      margin:0 0 8px;
      font-size:1.15rem;
      font-weight:620;
      letter-spacing:.01em;
    }
    p{
      margin:0;
      color:var(--muted);
      font-size:.95rem;
      line-height:1.5;
    }
    .stage{
      margin-top:18px;
      border:1px solid #27314a;
      border-radius:14px;
      background:linear-gradient(155deg,#10182a 0%,#0b1220 100%);
      padding:20px;
      display:grid;
      place-items:center;
      min-height:300px;
    }
    .stage svg{
      width:min(58%,170px,min(32vw,196px));
      max-width:100%;
      height:auto;
      overflow:visible;
    }
    .nota-morph-start path{
      transform-box:fill-box;
      transform-origin:center;
      will-change:d;
    }
    .nota-morph-target{
      visibility:hidden;
      pointer-events:none;
    }
    .controls{
      margin-top:14px;
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    button{
      border:0;
      border-radius:999px;
      padding:10px 16px;
      font-weight:600;
      background:var(--accent);
      color:#fff;
      cursor:pointer;
    }
    .hint{
      font-size:.85rem;
      color:#8d9ab7;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Nota Morph Isolated Test</h1>
    <p>Transition preview from <code>nota-expand.svg</code> into <code>nota.svg</code> using path morph interpolation.</p>

    <div class="stage">
      <svg id="nota-svg" viewBox="0 0 238 205" xmlns="http://www.w3.org/2000/svg" focusable="false" aria-label="Nota morph animation">
        <g class="nota-morph-start">
          <path d="M44.7895 182.441C44.7895 194.534 34.9869 204.336 22.8947 204.336C10.8026 204.336 0.999995 194.534 0.999994 182.441L1.00008 70.8945C1.00008 58.8024 10.8027 48.9998 22.8948 48.9998C34.9869 48.9998 44.7896 58.8024 44.7896 70.8945L44.7895 182.441Z" fill="#FF1B00"/>
          <path d="M237.789 133.836C237.789 145.928 227.987 155.731 215.895 155.731C203.803 155.731 194 145.928 194 133.836L194 22.2891C194 10.1969 203.803 0.394327 215.895 0.394326C227.987 0.394326 237.79 10.1969 237.79 22.2891L237.789 133.836Z" fill="#FF1B00"/>

          <path d="M93 182.455C93 194.548 83.1974 204.35 71.1053 204.35C59.0132 204.35 49.2105 194.548 49.2105 182.455L49.2105 21.8945C49.2105 9.8024 59.0131 -0.000204508 71.1053 -0.000205037C83.1974 -0.000205565 93 9.8024 93 21.8945L93 182.455Z" fill="#FF1B00"/>
          <path d="M193.999 182.29C193.999 170.198 203.802 160.395 215.894 160.395C227.987 160.395 237.789 170.198 237.789 182.29C237.789 194.382 227.987 204.185 215.894 204.185C203.802 204.185 193.999 194.382 193.999 182.29Z" fill="#FF1B00"/>

        </g>
        <g class="nota-morph-target">
          <g transform="translate(16.5 0)">
            <path d="M43.7894 182.443C43.7894 194.535 33.9868 204.338 21.8947 204.338C9.80258 204.338 -3.26597e-05 194.535 -3.31882e-05 182.443L7.7251e-05 90.8947C7.67224e-05 78.8026 9.80268 69 21.8948 69C33.9869 69 43.7896 78.8026 43.7896 90.8947C43.7895 134.457 43.7895 138.881 43.7894 182.443Z" fill="#FF1B00"/>

            <path d="M204.789 107.836C204.789 119.928 194.987 129.731 182.895 129.731C170.803 129.731 161 119.928 161 107.836L161 22.2893C161 10.1971 170.803 0.394533 182.895 0.394532C194.987 0.394532 204.79 10.1971 204.79 22.2893L204.789 107.836Z" fill="#FF1B00"/>

            <path d="M78.9999 104.895C78.9999 92.8024 88.8025 83 100.895 83C112.987 83 122.79 92.8024 122.79 104.895C122.79 116.987 112.987 126.79 100.895 126.79C88.8025 126.79 78.9999 116.987 78.9999 104.895Z" fill="#FF1B00"/>
            <path d="M47.9999 64.895C47.9999 52.8029 57.8025 43.0003 69.8947 43.0003C81.9868 43.0003 91.7895 52.8029 91.7895 64.895C91.7895 76.9871 81.9868 86.7897 69.8947 86.7897C57.8025 86.7897 47.9999 76.9871 47.9999 64.895Z" fill="#FF1B00"/>
          </g>
        </g>
      </svg>
    </div>

    <div class="controls">
      <button id="replay-btn" type="button">Replay</button>
      <label class="hint"><input id="loop-checkbox" type="checkbox" /> Loop</label>
    </div>
  </main>

  <script>
    const svg = document.getElementById("nota-svg");
    const startLayer = svg.querySelector(".nota-morph-start");
    const targetLayer = svg.querySelector(".nota-morph-target");
    const startPaths = Array.from(startLayer.querySelectorAll("path"));
    const targetPaths = Array.from(targetLayer.querySelectorAll("path"));
    const replayBtn = document.getElementById("replay-btn");
    const loopCheckbox = document.getElementById("loop-checkbox");

    const samplePoints = 92;
    const holdBeforeMorphMs = 180;
    const durationMs = 1180;
    let rafId = 0;
    let holdTimer = 0;
    let loopTimer = 0;

    function clamp01(value){ return Math.min(1, Math.max(0, value)); }
    function easeInOutCubic(t){ return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

    function centerFromPoints(points){
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      points.forEach((point) => {
        minX = Math.min(minX, point.x);
        minY = Math.min(minY, point.y);
        maxX = Math.max(maxX, point.x);
        maxY = Math.max(maxY, point.y);
      });
      return { x: (minX + maxX) / 2, y: (minY + maxY) / 2 };
    }

    function samplePathPointsInSvg(path, count){
      const points = [];
      const length = path.getTotalLength();
      const matrix = path.getCTM();
      const svgPoint = svg.createSVGPoint();
      for(let i = 0; i < count; i += 1){
        const t = i / (count - 1);
        const sample = path.getPointAtLength(length * t);
        svgPoint.x = sample.x;
        svgPoint.y = sample.y;
        const out = matrix ? svgPoint.matrixTransform(matrix) : { x: sample.x, y: sample.y };
        points.push({ x: out.x, y: out.y });
      }
      return points;
    }

    function pointsToPathD(points){
      if(!points.length) return "";
      const [first, ...rest] = points;
      const head = `M${first.x.toFixed(3)} ${first.y.toFixed(3)}`;
      const body = rest.map((point) => `L${point.x.toFixed(3)} ${point.y.toFixed(3)}`).join("");
      return `${head}${body}Z`;
    }

    function interpolatePoints(from, to, t){
      return from.map((point, idx) => ({
        x: point.x + (to[idx].x - point.x) * t,
        y: point.y + (to[idx].y - point.y) * t
      }));
    }

    function buildModel(){
      const startEntries = startPaths.map((path, idx) => {
        const points = samplePathPointsInSvg(path, samplePoints);
        return { idx, points, center: centerFromPoints(points) };
      }).sort((a, b) => (a.center.x - b.center.x) || (a.center.y - b.center.y));

      const targetEntries = targetPaths.map((path, idx) => {
        const points = samplePathPointsInSvg(path, samplePoints);
        return { idx, points, center: centerFromPoints(points) };
      }).sort((a, b) => (a.center.x - b.center.x) || (a.center.y - b.center.y));
      const remappedTargets = [...targetEntries];
      if(remappedTargets.length >= 2){
        const last = remappedTargets.length - 1;
        [remappedTargets[last - 1], remappedTargets[last]] = [remappedTargets[last], remappedTargets[last - 1]];
      }

      const out = new Array(startPaths.length);
      startEntries.forEach((entry, orderIdx) => {
        const target = remappedTargets[orderIdx];
        out[entry.idx] = {
          sourcePoints: entry.points,
          targetPoints: target.points,
          sourceD: pointsToPathD(entry.points),
          morphDelay: orderIdx * 38
        };
      });
      return out;
    }

    const model = buildModel();

    function clearTimersAndFrame(){
      if(rafId){ cancelAnimationFrame(rafId); rafId = 0; }
      if(holdTimer){ clearTimeout(holdTimer); holdTimer = 0; }
      if(loopTimer){ clearTimeout(loopTimer); loopTimer = 0; }
    }

    function resetState(){
      startPaths.forEach((path, idx) => {
        path.setAttribute("d", model[idx].sourceD);
      });
    }

    function runMorph(){
      const startAt = performance.now();
      const tailDelay = model[model.length - 1].morphDelay;

      function tick(now){
        let active = false;
        startPaths.forEach((path, idx) => {
          const m = model[idx];
          const raw = (now - startAt - m.morphDelay) / durationMs;
          if(raw < 0){
            active = true;
            return;
          }
          const clamped = clamp01(raw);
          const eased = easeInOutCubic(clamped);
          const points = interpolatePoints(m.sourcePoints, m.targetPoints, eased);
          path.setAttribute("d", pointsToPathD(points));
          if(raw < 1) active = true;
        });
        if(active){
          rafId = requestAnimationFrame(tick);
        }else{
          rafId = 0;
          if(loopCheckbox.checked){
            loopTimer = setTimeout(play, tailDelay + 1300);
          }
        }
      }

      rafId = requestAnimationFrame(tick);
    }

    function play(){
      clearTimersAndFrame();
      resetState();
      holdTimer = setTimeout(runMorph, holdBeforeMorphMs);
    }

    replayBtn.addEventListener("click", play);
    loopCheckbox.addEventListener("change", () => {
      if(loopCheckbox.checked){
        play();
      }else if(loopTimer){
        clearTimeout(loopTimer);
        loopTimer = 0;
      }
    });

    play();
  </script>
</body>
</html>
