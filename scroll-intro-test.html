<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero scroll test — fixed viewport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Didact+Gothic&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#fdfcfa;
  --ink:#000;
  --red:#FF1B00;
  --ease-out-flow:cubic-bezier(0.22,1,0.52,1);
  --ease-out-settle:cubic-bezier(0.33,1,0.68,1);
  --ease-in-move:cubic-bezier(0.55,0.02,0.72,0.35);
  --g:88px;
}
html,body{
  height:100%;
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:none;
}
body{
  background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;
}

/* Fixed stage — no page scroll; wheel / touch only drive motion */
.stage{
  position:fixed;inset:0;z-index:1;
  display:flex;flex-direction:column;
  justify-content:center;
  background:var(--bg);
  overflow:hidden;
  touch-action:none;
}
.hero-content{
  position:relative;z-index:2;
  padding:80px var(--g) 60px;
  text-align:center;
}
.hero-hl{
  font-family:'Didact Gothic',sans-serif;
  font-size:clamp(52px,12vw,120.75px);
  font-weight:500;
  line-height:0.94;letter-spacing:-0.03em;color:var(--ink);
}
.hero-hl.revealed .hl-char{transform:translateY(0) rotate(0deg);opacity:1;}
#hero-cycle-word{color:var(--red);}

.hl-line{
  display:block;overflow:visible;
  clip-path:inset(-0.06em -5000px 0 -5000px);
  padding-bottom:0.22em;margin-bottom:-0.22em;
}
.hl-inner{display:block;}
.hl-word{display:inline-block;}
.hl-char{
  display:inline-block;
  transform:translateY(-1.5em) rotate(var(--cr,0deg));
  opacity:0;
  transition:transform var(--cd,0.78s) var(--ease-out-flow);
  transform-origin:50% 0;
}
.hl-char--space{display:inline;transform:none!important;opacity:1!important;transition:none!important;}
/* Straight fall: do not reuse --cr here; staggerChars leaves random --cr on each
   letter for the *in* motion only — exit was re-applying it and looked crooked. */
.hl-char-exit{
  transform:translateY(1.15em) rotate(0deg)!important;
  transition:transform var(--cd,0.38s) var(--ease-in-move)!important;
}
.hero-hl.headline-scroll-exit .hl-line{
  clip-path:inset(-0.06em -5000px -2.5em -5000px);
}

.hint{
  position:fixed;bottom:28px;left:0;right:0;z-index:2;
  text-align:center;
  font-size:11px;letter-spacing:0.14em;text-transform:uppercase;
  color:rgba(0,0,0,0.38);
  pointer-events:none;
}

@media(max-width:900px){ :root{--g:28px;} }
@media(max-width:600px){
  :root{--g:20px;}
  .hero-hl{font-size:clamp(42px,13vw,80px);}
}
</style>
</head>
<body>

<div class="stage" id="stage" role="presentation">
  <div class="hero-content">
    <h1 class="hero-hl" id="hero-hl">
      <span class="hl-line"><span class="hl-inner">We're <span id="hero-cycle-word">making</span></span></span>
      <span class="hl-line"><span class="hl-inner">our way into a new</span></span>
      <span class="hl-line"><span class="hl-inner">design practice.</span></span>
    </h1>
  </div>
</div>
<p class="hint" id="hint">Scroll or swipe — page stays still</p>

<script>
function splitToChars(source, target){
  if(!target) target = source;
  var nodes = Array.from(source.childNodes);
  if(target === source) target.innerHTML = '';
  nodes.forEach(function(node){
    if(node.nodeType === 3){
      node.textContent.split(/(\s+)/).forEach(function(part){
        if(!part) return;
        if(/^\s+$/.test(part)){
          var sp = document.createElement('span');
          sp.className = 'hl-char hl-char--space';
          sp.textContent = '\u00a0';
          target.appendChild(sp);
        } else {
          var word = document.createElement('span');
          word.className = 'hl-word';
          part.split('').forEach(function(ch){
            var s = document.createElement('span');
            s.className = 'hl-char';
            s.textContent = ch;
            word.appendChild(s);
          });
          target.appendChild(word);
        }
      });
    } else if(node.nodeType === 1){
      var w = node.cloneNode(false);
      target.appendChild(w);
      splitToChars(node, w);
    }
  });
}
function staggerChars(chars){
  chars.forEach(function(ch, i){
    ch.style.transitionDelay = (i * 22 + Math.random() * 110).toFixed(0) + 'ms';
    ch.style.setProperty('--cd', (0.48 + Math.random() * 0.68).toFixed(2) + 's');
    ch.style.setProperty('--cr', (Math.random() * 7 - 3.5).toFixed(1) + 'deg');
  });
}
</script>

<script>
(function(){
  var stage     = document.getElementById('stage');
  var heroHl    = document.getElementById('hero-hl');
  var cycleWrap = document.getElementById('hero-cycle-word');
  var hint      = document.getElementById('hint');
  if(!heroHl || !cycleWrap || !stage) return;

  heroHl.querySelectorAll('.hl-inner').forEach(function(inner){ splitToChars(inner); });
  var allChars = Array.from(heroHl.querySelectorAll('.hl-char:not(.hl-char--space)'));
  staggerChars(allChars);

  var CYCLE_WORDS = ['making','building','breaking'];
  var cycleIdx = 0;
  var cycleTimer = null;
  var revealTimer = null;
  var hasRevealedHeadline = false;
  var headlineScrollExited = false;
  var scrollIntent = 0;

  function exitThreshold(){
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    return reduce ? 80 : Math.min(420, Math.max(180, window.innerHeight * 0.35));
  }

  function fallHeadlineOut(){
    if(headlineScrollExited || !heroHl.classList.contains('revealed')) return;
    headlineScrollExited = true;
    clearCycle();
    if(revealTimer){ clearTimeout(revealTimer); revealTimer = null; }
    if(hint) hint.textContent = 'Reload to try again';
    heroHl.classList.add('headline-scroll-exit');
    var chars = Array.from(heroHl.querySelectorAll('.hl-char:not(.hl-char--space)'));
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    chars.forEach(function(c, i){
      if(reduce){
        c.style.transitionDelay = '0ms';
        c.style.setProperty('--cd', '0.01s');
      } else {
        c.style.transitionDelay = (i * 20 + Math.random() * 48).toFixed(0) + 'ms';
        c.style.setProperty('--cd', (0.2 + Math.random() * 0.22).toFixed(2) + 's');
      }
      c.classList.add('hl-char-exit');
    });
  }

  function bumpIntent(amount){
    if(headlineScrollExited || !heroHl.classList.contains('revealed')) return;
    scrollIntent += amount;
    if(scrollIntent >= exitThreshold()) fallHeadlineOut();
  }

  function startHeroCycle(){
    function scheduleNext(){
      cycleTimer = setTimeout(function afterDwell(){
        cycleIdx = (cycleIdx + 1) % CYCLE_WORDS.length;
        var exits = Array.from(cycleWrap.querySelectorAll('.hl-char'));
        exits.forEach(function(c){
          c.style.setProperty('--cd', (0.18 + Math.random() * 0.22).toFixed(2) + 's');
          c.classList.add('hl-char-exit');
        });
        cycleTimer = setTimeout(function doSwap(){
          cycleWrap.innerHTML = '';
          CYCLE_WORDS[cycleIdx].split('').forEach(function(ch){
            var s = document.createElement('span');
            s.className = 'hl-char';
            s.textContent = ch;
            s.style.transform = 'translateY(-1.5em)';
            s.style.opacity = '1';
            s.style.transition = 'transform 0.78s var(--ease-out-flow)';
            cycleWrap.appendChild(s);
          });
          var enters = Array.from(cycleWrap.querySelectorAll('.hl-char'));
          enters.forEach(function(c, i){
            var d = i * 32 + Math.random() * 90 + 12;
            setTimeout(function(){ c.style.transform = 'translateY(0)'; }, d);
          });
          scheduleNext();
        }, exits.length * 28 + 360);
      }, 3000);
    }
    scheduleNext();
  }

  function clearCycle(){ if(cycleTimer){ clearTimeout(cycleTimer); cycleTimer = null; } }

  revealTimer = setTimeout(function(){
    revealTimer = null;
    hasRevealedHeadline = true;
    heroHl.classList.add('revealed');
    setTimeout(function(){ if(!headlineScrollExited) startHeroCycle(); }, 1200);
  }, 300);

  function onWheel(e){
    if(headlineScrollExited) return;
    e.preventDefault();
    if(e.deltaY > 0) bumpIntent(e.deltaY);
  }

  var touchY = null;
  function onTouchStart(e){
    if(headlineScrollExited || e.touches.length !== 1) return;
    touchY = e.touches[0].clientY;
  }
  function onTouchMove(e){
    if(headlineScrollExited || touchY == null || !heroHl.classList.contains('revealed')) return;
    e.preventDefault();
    var y = e.touches[0].clientY;
    var dy = touchY - y;
    touchY = y;
    if(dy > 0) bumpIntent(dy * 1.2);
  }
  function onTouchEnd(){ touchY = null; }

  function onKeyDown(e){
    if(headlineScrollExited || !heroHl.classList.contains('revealed')) return;
    if(e.key === 'ArrowDown' || e.key === 'PageDown'){
      e.preventDefault();
      bumpIntent(100);
    } else if(e.key === ' ' && !e.repeat){
      e.preventDefault();
      bumpIntent(140);
    }
  }

  window.addEventListener('wheel', onWheel, { passive: false });
  window.addEventListener('touchstart', onTouchStart, { passive: true });
  window.addEventListener('touchmove', onTouchMove, { passive: false });
  window.addEventListener('touchend', onTouchEnd, { passive: true });
  window.addEventListener('keydown', onKeyDown);
})();
</script>
</body>
</html>
