<style>
*{margin:0;padding:0;box-sizing:border-box;}
.sr-only{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  border:0;
  white-space:nowrap;
}
:root{
  --mid:rgba(221,219,214,0.5);
  --g:88px;
}
@media(max-width:900px){:root{--g:28px;}}
@media(max-width:600px){:root{--g:20px;}}
html,body{
  width:100%;
  min-height:100%;
  overflow-x:hidden;
  overflow-y:auto;
  background:#000;
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}
/* ── STAGE — full grid scrolls; wordmark is a fixed overlay ── */
.stage{
  position:relative;
  z-index:0;
  width:100%;
}

/* ── VIDEO GRID (scrolls; wordmark overlays, no bar) ── */
.grid-stack{
  position:relative;
  z-index:0;
  display:flex;
  flex-direction:column;
  /* Only when viewport is taller than 2×(50vw) tiles: minimal pad so page can scroll for wordmark drop */
  padding-bottom:max(0px, calc(100dvh - 100vw + 64px));
}
.grid-row--top,
.grid-row--bottom{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0;
  width:100%;
}
.grid-row--top .cell,
.grid-row--bottom .cell{
  width:100%;
  aspect-ratio:1/1;
  min-height:0;
  position:relative;
}
.cell{
  position:relative;
  overflow:hidden;
  box-sizing:border-box;
}
.cell video{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  display:block;
}
/* per-quadrant tweaks */
.grid-row--top .cell:nth-child(1) video{ filter:saturate(1.35) contrast(1.08); }
.grid-row--top .cell:nth-child(2) video{ filter:saturate(1.12) contrast(1.04); }
.grid-row--bottom .cell:nth-child(1) video{ filter:saturate(1.2) contrast(1.05); }
.grid-row--bottom .cell:nth-child(2) video{ filter:saturate(1.22) contrast(1.06) brightness(0.98); }

/* ── Wordmark: full width; JS keeps bar at viewport bottom + spring lag on scroll ── */
.cs-wordmark-fixed{
  position:fixed;
  left:0;
  right:0;
  top:0;
  z-index:30;
  background:transparent;
  pointer-events:none;
  will-change:top;
}
.cs-wordmark-fixed-inner{
  padding:0;
  pointer-events:none;
}
.cs-wordmark-fixed .wordmark-row{ pointer-events:auto; }
.wordmark-row{
  padding:4px 0 0;
  display:flex;
  align-items:flex-end;
  gap:24px;
}
.wordmark{
  flex:1;
  min-width:0;
  cursor:default;
  position:relative;
  color:#DDDBD6;
}
.wordmark-svg-physics{
  width:100%;
  height:auto;
  display:block;
  overflow:visible;
}
.wordmark-svg-physics .wm-l path,
.wordmark-svg-physics .wm-l rect{fill:currentColor;}
.foot-copy{
  font-size:13px;
  font-weight:500;
  letter-spacing:0.06em;
  color:var(--mid);
  font-family:'Inter',sans-serif;
  white-space:nowrap;
  flex-shrink:0;
  padding-bottom:16px;
  padding-right:var(--g);
}

/* ── ENTRANCE ANIMATIONS ── */
@keyframes fadeIn{ from{opacity:0;}to{opacity:1;} }
.stage{ animation:fadeIn 1s 0s both; }

<script>
// Stagger video playback so cells don't cycle in sync
document.querySelectorAll('.cell video').forEach(function(v,i){
  v.addEventListener('loadedmetadata',function(){
    if(v.duration) v.currentTime = (v.duration / 4) * i;
  });
});

// Wordmark bar: fixed high until ouro-wm-release, then springs to viewport bottom + scroll lag
(function(){
  var bar = document.querySelector('.cs-wordmark-fixed');
  if(!bar) return;

  var PAD = 12;
  var START_FRAC = 0.12;
  var SPRING = 0.016;
  var DAMP = 0.92;
  var SCROLL_KICK = 0.07;
  var MAX_DELTA = 48;

  var pos = null;
  var vel = 0;
  var lastScrollY = window.scrollY || 0;
  var released = false;

  function viewportH(){
    return window.visualViewport ? window.visualViewport.height : window.innerHeight;
  }

  function topWhenHeld(){
    return Math.max(56, Math.round(viewportH() * START_FRAC));
  }

  function topWhenBottom(){
    return viewportH() - bar.offsetHeight - PAD;
  }

  function desiredTop(){
    return released ? topWhenBottom() : topWhenHeld();
  }

  function tick(){
    var tgt = desiredTop();
    if(pos === null) pos = tgt;
    vel = (vel + (tgt - pos) * SPRING) * DAMP;
    pos += vel;
    bar.style.top = Math.round(pos) + 'px';
    requestAnimationFrame(tick);
  }

  window.addEventListener('scroll', function(){
    var sy = window.scrollY || document.documentElement.scrollTop || 0;
    var delta = Math.max(-MAX_DELTA, Math.min(MAX_DELTA, sy - lastScrollY));
    lastScrollY = sy;
    if(released && delta) vel -= delta * SCROLL_KICK;
  }, { passive: true });

  document.addEventListener('ouro-wm-release', function(){
    released = true;
  });

  function snapPosition(){
    pos = desiredTop();
    vel = 0;
  }

  window.addEventListener('resize', snapPosition);
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', snapPosition);
  }
  if(window.ResizeObserver){
    var ro = new ResizeObserver(snapPosition);
    ro.observe(bar);
  }
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(snapPosition);
  window.addEventListener('load', snapPosition);
  snapPosition();
  requestAnimationFrame(tick);
})();

function shuffleInPlace(arr){
  for(var i = arr.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i];
    arr[i] = arr[j];
    arr[j] = t;
  }
  return arr;
}

// Letters: idle until first scroll (settle + delay), then drop in random order as bar falls to bottom
(function(){
  var svgEl = document.querySelector('.wordmark-svg-physics');
  var letters = svgEl ? svgEl.querySelectorAll('.wm-l') : [];
  if(!letters.length) return;

  var VW = 2297, VH = 413;
  var n = letters.length;
  var rests = [
    [165,  255],
    [329+165, 98+158],
    [658+92,  98+158],
    [994,  255],
    [1315, 213],
    [1535, 259],
    [1861, 217],
    [2144, 259],
  ];

  function easeDrop(t){
    return 1 - Math.pow(1 - t, 4);
  }

  function buildIntroSchedule(t0){
    var order = shuffleInPlace(Array.from({ length: n }, function(_, i){ return i; }));
    var byIdx = {};
    var slotT = t0;
    order.forEach(function(idx){
      byIdx[idx] = {
        start: slotT,
        dur: 1500 + Math.random() * 2400,
        drop: 78 + Math.random() * 72,
      };
      slotT += 140 + Math.random() * 220;
    });
    return byIdx;
  }

  var SPRING = 0.03;
  var DAMP = 0.89;
  var REPEL = 62000;
  var MAX_F = 14;
  var RADIUS_PX = 180;

  var mx = -99999, my = -99999;
  document.addEventListener('mousemove', function(e){ mx = e.clientX; my = e.clientY; });

  var states = Array.from(letters).map(function(el, i){
    return { el: el, x: 0, y: 0, vx: 0, vy: 0, rest: rests[i], intro: null };
  });

  function applyIntro(byIdx){
    states.forEach(function(s, i){
      s.intro = byIdx[i];
      s.x = 0;
      s.y = 0;
      s.vx = 0;
      s.vy = 0;
    });
  }

  function idleIntro(){
    var by = {};
    for(var i = 0; i < n; i++){
      by[i] = { start: 0, dur: 0, drop: 0 };
    }
    return by;
  }

  applyIntro(idleIntro());

  var SETTLE_MS = 340;
  var DELAY_MIN = 320;
  var DELAY_MAX = 900;
  var lastScrollY = window.scrollY || document.documentElement.scrollTop || 0;
  var settleTimer = null;
  var delayTimer = null;
  var hasReleased = false;

  window.addEventListener('scroll', function(){
    if(hasReleased) return;
    var sy = window.scrollY || document.documentElement.scrollTop || 0;
    if(Math.abs(sy - lastScrollY) < 1) return;
    lastScrollY = sy;
    if(delayTimer){
      clearTimeout(delayTimer);
      delayTimer = null;
    }
    if(settleTimer) clearTimeout(settleTimer);
    settleTimer = setTimeout(function(){
      settleTimer = null;
      var wait = DELAY_MIN + Math.random() * (DELAY_MAX - DELAY_MIN);
      delayTimer = setTimeout(function(){
        delayTimer = null;
        hasReleased = true;
        var now = performance.now();
        document.dispatchEvent(new CustomEvent('ouro-wm-release'));
        applyIntro(buildIntroSchedule(now + 140));
      }, wait);
    }, SETTLE_MS);
  }, { passive: true });

  (function tick(){
    requestAnimationFrame(tick);
    var now = performance.now();
    var r = svgEl.getBoundingClientRect();
    var vb = svgEl.viewBox.baseVal;
    var sx = r.width / (vb.width || VW);
    var sy = r.height / (vb.height || VH);
    var mxS = (mx - r.left) / sx + (vb.x || 0);
    var myS = (my - r.top) / sy + (vb.y || 0);

    states.forEach(function(s){
      var inn = s.intro;
      if(now < inn.start){
        s.x = 0;
        s.y = -inn.drop;
        s.vx = s.vy = 0;
        s.el.setAttribute('transform', 'translate(0,' + (-inn.drop).toFixed(1) + ')');
        return;
      }
      if(now < inn.start + inn.dur){
        var u = (now - inn.start) / inn.dur;
        if(u > 1) u = 1;
        var e = easeDrop(u);
        s.y = -inn.drop * (1 - e);
        s.x = 0;
        s.vx = s.vy = 0;
        s.el.setAttribute('transform', 'translate(0,' + s.y.toFixed(1) + ')');
        return;
      }

      var cx = s.rest[0] + s.x;
      var cy = s.rest[1] + s.y;
      var dx = mxS - cx;
      var dy = myS - cy;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var radS = RADIUS_PX / sx;
      var fx = 0, fy = 0;
      if(dist < radS && dist > 0.5){
        var mag = Math.min(REPEL / (dist * dist), MAX_F);
        fx = -(dx / dist) * mag;
        fy = -(dy / dist) * mag;
      }
      fx -= SPRING * s.x;
      fy -= SPRING * s.y;
      s.vx = (s.vx + fx) * DAMP;
      s.vy = (s.vy + fy) * DAMP;
      s.x += s.vx;
      s.y += s.vy;
      s.el.setAttribute('transform', 'translate(' + s.x.toFixed(1) + ',' + s.y.toFixed(1) + ')');
    });
  })();
})();
</script>
