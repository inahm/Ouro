<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ouro Motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    /* Figma-like dark chrome: viewport vs panels */
    --lc-bg: #1e1e1e;
    --lc-surface: #333333;
    --lc-panel: #2c2c2c;
    --lc-panel-2: #3d3d3d;
    --lc-line: rgba(255, 255, 255, 0.06);
    --lc-text: #f5f5f5;
    --lc-muted: #b3b3b3;
    --lc-accent: #0d99ff;
    --lc-accent-hover: #33adff;
    --lc-primary: var(--lc-accent);
    --lc-primary-hover: var(--lc-accent-hover);
    --lc-playhead: #f5f5f5;
    --lc-canvas: #2c2c2c;
    --lc-dot: rgba(255, 255, 255, 0.09);
    --lc-r: 8px;
    --lc-r-sm: 6px;
    --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Consolas", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--lc-bg);
    color: var(--lc-text);
    font-family: var(--font);
    font-size: 12px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  .lc-app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .lc-topbar {
    flex-shrink: 0;
    height: 40px;
    display: flex;
    align-items: center;
    padding: 0 12px 0 14px;
    gap: 10px;
    background: var(--lc-panel);
    border-bottom: 1px solid var(--lc-line);
  }
  .lc-topbar__logo {
    font-weight: 600;
    font-size: 13px;
    letter-spacing: -0.02em;
  }
  .lc-topbar__tag {
    font-size: 11px;
    color: var(--lc-muted);
    font-weight: 400;
  }
  .lc-topbar__spacer { flex: 1; }
  .lc-workspace {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(220px, 240px) 1fr minmax(268px, 300px);
    min-height: 0;
    overflow: hidden;
  }
  @media (max-width: 1024px) {
    .lc-workspace { grid-template-columns: 1fr; }
  }
  .lc-sidebar {
    background: var(--lc-panel);
    overflow: auto;
    padding: 12px 10px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .lc-sidebar--left {
    border-right: 1px solid var(--lc-line);
    background: var(--lc-panel);
  }
  .lc-sidebar--right {
    border-left: 1px solid var(--lc-line);
  }
  .lc-section__title {
    font-size: 11px;
    font-weight: 600;
    color: var(--lc-muted);
    margin: 0 0 10px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .lc-asset-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .lc-asset-tile {
    background: var(--lc-surface);
    border-radius: var(--lc-r);
    overflow: hidden;
    border: 1px solid var(--lc-line);
  }
  .lc-asset-tile__cap {
    font-size: 10px;
    font-weight: 500;
    padding: 8px 10px;
    color: var(--lc-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .lc-asset-tile__body {
    padding: 10px;
    min-height: 76px;
    display: grid;
    place-items: center;
    background: var(--lc-surface);
  }
  .lc-asset-tile .vector-compare__svg {
    width: 100%;
    max-height: 68px;
    overflow: visible;
    shape-rendering: geometricPrecision;
    opacity: 0.95;
  }
  .lc-upload-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .lc-btn {
    font: inherit;
    cursor: pointer;
    border-radius: var(--lc-r-sm);
    padding: 8px 14px;
    border: 1px solid var(--lc-line);
    background: transparent;
    color: var(--lc-text);
    font-size: 12px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  .lc-btn:hover {
    background: var(--lc-panel-2);
    border-color: rgba(255, 255, 255, 0.12);
  }
  .lc-btn--primary {
    background: var(--lc-accent);
    border-color: transparent;
    color: #ffffff;
  }
  .lc-btn--primary:hover {
    background: var(--lc-accent-hover);
    border-color: transparent;
  }
  .lc-file-hint {
    font-size: 11px;
    color: var(--lc-muted);
    margin: 0;
    line-height: 1.45;
  }
  .lc-file-inputs {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 8px;
  }
  .lc-file-inputs label {
    font-size: 11px;
    font-weight: 500;
    color: var(--lc-muted);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .lc-file-inputs input[type="file"] {
    font-size: 11px;
    max-width: 100%;
    color: var(--lc-muted);
  }
  .lc-canvas-col {
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--lc-bg);
  }
  .lc-canvas-meta {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    font-size: 11px;
    color: var(--lc-muted);
    background: var(--lc-panel);
    border-bottom: 1px solid var(--lc-line);
  }
  .lc-canvas-meta code { font-family: var(--mono); font-size: 11px; opacity: 0.9; }
  .lc-canvas-meta__status {
    margin-left: auto;
    color: var(--lc-text);
    font-size: 11px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--lc-surface);
    border: 1px solid var(--lc-line);
  }
  .lc-canvas-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 20px 56px;
    position: relative;
    min-height: 280px;
    background-color: var(--lc-bg);
    background-image: radial-gradient(var(--lc-dot) 1.25px, transparent 1.25px);
    background-size: 20px 20px;
    background-position: 0 0;
  }
  .lc-canvas-sheet {
    position: relative;
    width: min(100%, 400px);
    aspect-ratio: 1;
    max-height: min(60vh, 500px);
    background-color: var(--lc-canvas);
    border-radius: 2px;
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.08),
      0 4px 24px rgba(0, 0, 0, 0.35);
    background-image: none;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: center;
    padding: 24px;
    min-height: 0;
  }
  .lc-svg-host {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 0;
    position: relative;
    z-index: 1;
  }
  .lc-scene-badge {
    position: absolute;
    top: 14px;
    left: 16px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--lc-muted);
    z-index: 2;
  }
  .lc-scene-size {
    position: absolute;
    top: 14px;
    right: 16px;
    font-size: 11px;
    font-family: var(--mono);
    font-weight: 500;
    color: var(--lc-muted);
    z-index: 2;
  }
  .lc-svg-host .nota-morph-svg {
    display: block;
    width: auto;
    height: auto;
    max-width: min(268px, 100%);
    max-height: 100%;
    overflow: visible;
    shape-rendering: geometricPrecision;
    filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.5));
  }
  .lc-svg-host .nota-morph-target {
    visibility: hidden;
    pointer-events: none;
  }
  .lc-transport-float {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 5px 7px 5px 5px;
    background: rgba(44, 44, 44, 0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 999px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    z-index: 2;
  }
  .lc-transport-float button {
    font: inherit;
    cursor: pointer;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--lc-text);
    font-size: 16px;
    line-height: 1;
    display: grid;
    place-items: center;
    transition: background 0.1s ease;
  }
  .lc-transport-float button:hover { background: rgba(255, 255, 255, 0.08); }
  .lc-transport-float button.lc-tf-play {
    background: var(--lc-accent);
    color: #ffffff;
    width: 42px;
    height: 42px;
  }
  .lc-transport-float button.lc-tf-play:hover { background: var(--lc-primary-hover); }
  .lc-transport-float label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 500;
    color: var(--lc-muted);
    margin-left: 4px;
    padding-left: 12px;
    border-left: 1px solid var(--lc-line);
    cursor: pointer;
  }
  .lc-prop-section { margin-bottom: 4px; }
  .lc-prop-section__title {
    font-size: 11px;
    font-weight: 600;
    color: var(--lc-muted);
    margin: 0 0 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .lc-prop-name {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    color: var(--lc-text);
    padding: 10px 12px;
    background: var(--lc-surface);
    border: 1px solid var(--lc-line);
    border-radius: var(--lc-r-sm);
    word-break: break-word;
  }
  .lc-timecode-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 10px;
  }
  .lc-timecode-row .cur { color: var(--lc-text); }
  .lc-timecode-row .sep { color: var(--lc-muted); font-size: 13px; }
  .lc-timecode-row .end { color: var(--lc-muted); }
  .lc-fps-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }
  .lc-fps-row label { font-size: 12px; font-weight: 500; color: var(--lc-muted); }
  .lc-fps-row select {
    font: inherit;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: var(--lc-r-sm);
    border: 1px solid var(--lc-line);
    background: var(--lc-surface);
    color: var(--lc-text);
    cursor: pointer;
  }
  .lc-frame-readout {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--lc-muted);
    margin-top: 2px;
  }
  .lc-mirror-stack {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .lc-field { margin-bottom: 0; }
  .lc-field + .lc-field { margin-top: 12px; }
  .lc-field label {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    color: var(--lc-muted);
  }
  .lc-field input[type="range"] {
    width: 100%;
    height: 6px;
    accent-color: var(--lc-accent);
  }
  .lc-field .val {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    color: var(--lc-text);
    align-self: flex-end;
  }
  .lc-field select {
    margin-top: 2px;
    font: inherit;
    font-size: 12px;
    padding: 8px 10px;
    border-radius: var(--lc-r-sm);
    border: 1px solid var(--lc-line);
    background: var(--lc-surface);
    color: var(--lc-text);
    cursor: pointer;
  }
  .lc-json textarea {
    width: 100%;
    min-height: 120px;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.4;
    padding: 12px;
    border-radius: var(--lc-r-sm);
    border: 1px solid var(--lc-line);
    background: var(--lc-surface);
    color: #d4d4d8;
    resize: vertical;
    tab-size: 2;
  }
  .lc-json-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }
  .lc-json-actions .lc-btn {
    padding: 7px 12px;
    font-size: 11px;
  }
  .lc-timeline {
    flex-shrink: 0;
    display: grid;
    grid-template-columns: minmax(160px, 200px) 1fr;
    min-height: 108px;
    max-height: 168px;
    border-top: 1px solid var(--lc-line);
    background: var(--lc-panel);
  }
  @media (max-width: 1024px) {
    .lc-timeline { grid-template-columns: 1fr; max-height: none; }
  }
  .lc-timeline__layers {
    border-right: 1px solid var(--lc-line);
    padding: 12px 14px;
    overflow: auto;
  }
  .lc-timeline__layers .layer-stack__title {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--lc-muted);
    margin: 0 0 10px;
  }
  .layer-stack {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .layer-row {
    display: grid;
    grid-template-columns: 52px 1fr;
    gap: 8px;
    align-items: center;
    font-size: 10px;
  }
  .layer-row__name {
    font-family: var(--mono);
    color: var(--lc-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .layer-row__track {
    position: relative;
    height: 6px;
    border-radius: 3px;
    background: var(--lc-surface);
    border: 1px solid var(--lc-line);
    overflow: hidden;
  }
  .layer-row__bar {
    position: absolute;
    top: 0;
    bottom: 0;
    border-radius: 3px;
    background: rgba(13, 153, 255, 0.22);
    min-width: 2px;
  }
  .layer-row__playhead {
    position: absolute;
    top: -2px;
    bottom: -2px;
    width: 2px;
    margin-left: -1px;
    background: var(--lc-playhead);
    border-radius: 1px;
    pointer-events: none;
  }
  .lc-timeline__tracks {
    padding: 12px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
    justify-content: center;
  }
  .timeline-ruler {
    height: 10px;
    border-radius: 4px;
    background: var(--lc-surface);
    border: 1px solid var(--lc-line);
    background-image: repeating-linear-gradient(
      90deg,
      transparent,
      transparent 47px,
      rgba(255, 255, 255, 0.05) 47px,
      rgba(255, 255, 255, 0.05) 48px
    );
  }
  .timeline-track-wrap {
    position: relative;
    height: 22px;
    border-radius: var(--lc-r-sm);
    border: 1px solid var(--lc-line);
    background: var(--lc-surface);
    overflow: hidden;
  }
  .timeline-progress {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 0%;
    pointer-events: none;
    background: rgba(13, 153, 255, 0.12);
    border-right: 2px solid var(--lc-accent);
  }
  .timeline-scrub {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 22px;
    margin: 0;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    cursor: pointer;
  }
  .timeline-scrub::-webkit-slider-runnable-track { height: 22px; background: transparent; }
  .timeline-scrub::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 8px;
    height: 18px;
    margin-top: 2px;
    border-radius: 3px;
    background: var(--lc-playhead);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.2);
  }
  .timeline-scrub::-moz-range-track { height: 22px; background: transparent; }
  .timeline-scrub::-moz-range-thumb {
    width: 8px;
    height: 18px;
    border: none;
    border-radius: 3px;
    background: var(--lc-playhead);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.2);
  }
  .time-readouts {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11px;
  }
  #time-readout { color: var(--lc-muted); }
  .time-readout__hint { color: var(--lc-muted); font-size: 10px; opacity: 0.85; }
  .svg-chrome__bar { display: none; }
  .vector-compare__label { display: none; }
  .vector-compare__card {
    border-radius: 0 0 var(--lc-r-sm) var(--lc-r-sm);
    border: none;
    border-top: 1px solid var(--lc-line);
    background: var(--lc-surface);
    padding: 8px 10px;
  }
  .lc-json-details {
    border: 1px solid var(--lc-line);
    border-radius: var(--lc-r-sm);
    background: var(--lc-surface);
    overflow: hidden;
  }
  .lc-json-details summary {
    list-style: none;
    cursor: pointer;
    padding: 10px 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--lc-muted);
    user-select: none;
  }
  .lc-json-details summary::-webkit-details-marker { display: none; }
  .lc-json-details summary::after {
    content: "";
    float: right;
    width: 6px;
    height: 6px;
    margin-top: 5px;
    border-right: 1.5px solid var(--lc-muted);
    border-bottom: 1.5px solid var(--lc-muted);
    transform: rotate(45deg);
    transition: transform 0.15s ease;
    opacity: 0.7;
  }
  .lc-json-details[open] summary::after { transform: rotate(-135deg); margin-top: 8px; }
  .lc-json-details .lc-json-inner {
    padding: 0 12px 12px;
    border-top: 1px solid var(--lc-line);
  }
  .lc-json-details .lc-json textarea {
    border-radius: var(--lc-r-sm);
    min-height: 100px;
  }
  .lc-divider-dot {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--lc-muted);
    opacity: 0.45;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div class="lc-app">
  <header class="lc-topbar">
    <span class="lc-topbar__logo">Ouro Motion</span>
    <span class="lc-topbar__tag">SVG morph · offline</span>
    <span class="lc-topbar__spacer"></span>
  </header>

  <div class="lc-workspace">
    <aside class="lc-sidebar lc-sidebar--left" aria-label="Source files">
      <div>
        <h2 class="lc-section__title">Source</h2>
        <div class="lc-asset-grid">
          <div class="lc-asset-tile vector-compare__col--from">
            <div class="lc-asset-tile__cap">Before</div>
            <div class="lc-asset-tile__body">
              <svg id="om-preview-from" class="vector-compare__svg" viewBox="0 0 286 319" xmlns="http://www.w3.org/2000/svg"></svg>
            </div>
            <div class="vector-compare__card">
              <span class="lc-file-hint" id="om-chrome-from-meta"></span>
            </div>
          </div>
          <div class="lc-asset-tile lc-asset-tile--to vector-compare__col--to">
            <div class="lc-asset-tile__cap">After</div>
            <div class="lc-asset-tile__body">
              <svg id="om-preview-to" class="vector-compare__svg" viewBox="0 0 286 319" xmlns="http://www.w3.org/2000/svg"></svg>
            </div>
            <div class="vector-compare__card">
              <span class="lc-file-hint" id="om-chrome-to-meta"></span>
            </div>
          </div>
        </div>
      </div>

      <div>
        <p class="lc-file-hint">Two SVGs, same path count, order matched. Local to this browser until you restore the sample.</p>
        <div class="lc-upload-row">
          <button type="button" class="lc-btn" id="btn-restore-bundled" title="Restore bundled Health Atlas SVGs">Bundled</button>
          <button type="button" class="lc-btn lc-btn--primary" id="btn-load-svg-pair">Import…</button>
        </div>
        <div class="lc-file-inputs">
          <label>Start <input type="file" id="file-start-svg" accept=".svg,image/svg+xml" /></label>
          <label>End <input type="file" id="file-target-svg" accept=".svg,image/svg+xml" /></label>
        </div>
      </div>
    </aside>

    <section class="lc-canvas-col">
      <div class="lc-canvas-meta">
        <span id="om-chrome-main-meta"></span>
        <span class="lc-divider-dot" aria-hidden="true"></span>
        <span class="lc-canvas-meta__status" id="om-upload-status">Health Atlas</span>
      </div>
      <div class="lc-canvas-area">
        <div class="lc-canvas-sheet">
          <span class="lc-scene-badge">Canvas</span>
          <span class="lc-scene-size" id="lc-scene-dim">286 × 319</span>
          <div class="lc-svg-host">
            <svg class="nota-morph-svg" viewBox="0 0 286 319" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <g class="nota-morph-start">
                <path fill="#FF1B00" d="M224 103L224 34L270 34C278.837 34 286 41.1634 286 50L286 103L224 103Z"/>
                <path fill="#FF1B00" d="M224 189L224 147L272.793 147C280.087 147 286 152.913 286 160.207L286 189L224 189Z"/>

      f(r) +

      f(y + r) +

      f(r) +

      f(r) +

      f(y + h) +

      " " +
      f(y) +

      f(x + w) +

  function syncPreviewChrome() {

  /** Copy fill/stroke (attrs + computed) so preview paths match the main SVG. */
  function copySvgPathPresentation(src, dest, fillFallback) {

      "stroke",
      "stroke-width",
      "stroke-linecap",

      "stroke-opacity",

  function fmt(n) {
    return (Math.round(n * 1000) / 1000).toFixed(3);
  }

  function getDisplayFps() {
    var sel = document.getElementById("sel-fps");
    var v = sel ? parseInt(sel.value, 10) : 60;
    return v > 0 ? v : 60;
  }

  function pathSpanSec() {
    var d = doc.durationSec || 1;
    var mid = doc.midpointHoldSec || 0;
    return mid > 0 ? d + mid : d;
  }

  function padFramePair(cur, end) {
    var w = String(Math.max(cur, end)).length;
    w = Math.max(3, Math.min(5, w));

      n = Math.max(0, Math.round(n));
      var s = String(n);
      while (s.length < w) s = "0" + s;
      return s;
    }
    return pad(cur) + " / " + pad(end);
  }

  function formatTimecodeHMSf(tSec, fps) {
    fps = fps || 30;
    if (tSec < 0) tSec = 0;
    var frames = Math.min(359999, Math.floor(tSec * fps + 1e-6));
    var f = frames % fps;
    var totalSec = (frames - f) / fps;
    var s = Math.floor(totalSec % 60);
    var m = Math.floor(totalSec / 60);
    function z(n, d) {
      var str = String(Math.max(0, Math.floor(n)));

  function updateSceneDimensions() {
    var el = document.getElementById("lc-scene-dim");

    var vb = svg.getAttribute("viewBox") || "";
    var parts = vb.trim().split(/[\s,]+/);
    var w = parts.length >= 4 ? String(Math.round(parseFloat(parts[2]) || 0)) : "—";
    var h = parts.length >= 4 ? String(Math.round(parseFloat(parts[3]) || 0)) : "—";
    el.textContent = w + " × " + h;
  }

  function syncCompBar() {
    var el = document.getElementById("comp-name");
    if (!el) return;
    var name = (doc.meta && doc.meta.name) || "Morph";
    el.textContent = name;
    el.setAttribute("title", name);
  }

  function updateLayerStack() {
    var el = document.getElementById("layer-stack");
    if (!el) return;
    var sp = Math.max(1e-6, player.span());
    var hb = doc.holdBeforeSec || 0;
    var ps = pathSpanSec();
    var t = player.timeSec;
    var pHead = (t / sp) * 100;
    var parts = [];
    for (var i = 0; i < rows.length; i++) {
      var delay = rows[i].morphDelay || 0;
      var t0 = hb + delay;
      var L = (t0 / sp) * 100;
      var W = (ps / sp) * 100;

        '<div class="layer-row"><span class="layer-row__name">Shape ' +
          (i + 1) +
          '</span><div class="layer-row__track"><div class="layer-row__bar" style="left:' +
          L +
          "%;width:" +

          pHead +
          '%"></div></div></div>',
      );

  function syncScrubMax() {
    var sp = player.span();
    rngScrub.max = Math.max(10, Math.round(sp * 1000));
    rngScrub.value = Math.round(player.timeSec * 1000);

    if (timeEl) {

    updateLayerStack();

  var player = new Om.Player({

  /* Undo/redo for drags (sliders, scrub, easing, loop, FPS). */
  var motionUndoStack = [];

  function captureMotionUIState() {
    return {
      hold: document.getElementById("rng-hold").value,
      dur: document.getElementById("rng-dur").value,
      stag: document.getElementById("rng-stag").value,
      mid: document.getElementById("rng-mid").value,

  function motionStatesEqual(a, b) {
    if (!a || !b) return false;

      a.hold === b.hold &&
      a.dur === b.dur &&
      a.stag === b.stag &&
      a.mid === b.mid &&
      a.holdAfter === b.holdAfter &&
      a.speed === b.speed &&
      a.ease === b.ease &&
      a.loop === b.loop &&
      a.fps === b.fps &&
      Math.abs((a.timeSec || 0) - (b.timeSec || 0)) < 1e-5

  }

  function applyMotionUIState(s) {
    motionUndoApplying = true;
    try {
      document.getElementById("rng-hold").value = s.hold;
      document.getElementById("rng-dur").value = s.dur;
      document.getElementById("rng-stag").value = s.stag;
      document.getElementById("rng-mid").value = s.mid;
      document.getElementById("rng-hold-after").value = s.holdAfter;
      document.getElementById("rng-speed").value = s.speed;
      document.getElementById("sel-ease").value = s.ease;
      document.getElementById("chk-loop").checked = s.loop;
      document.getElementById("sel-fps").value = s.fps;

  function commitMotionUndoStep() {

  function resetMotionUndoHistory() {

  function motionUndo() {

  function extractPathsFromSvgText(text) {

          b.paths.length +

    var targetG = svg.querySelector(".nota-morph-target");
    if (!startG || !targetG) throw new Error("The preview area is missing its layers. Reload the page.");
    while (startG.firstChild) startG.removeChild(startG.firstChild);
    while (targetG.firstChild) targetG.removeChild(targetG.firstChild);
    function appendClone(parent, pathNode) {
      parent.appendChild(pathNode.cloneNode(true));

      a.viewBox ||
      b.viewBox ||

    doc.to = [];

      blendPick !== "capsule" &&
      blendPick !== "box" &&
      blendPick !== "paths"

    doc.blendShape = blendPick;
    readSlidersToDoc();
    rows = rebuildRows();
    player.setDocument(doc, rows);
    player.restart();
    syncScrubMax();
    updateVectorPreviews();
    pushDocToTextarea();
    syncCompBar();

    if (!options.skipStorage) {

            v: 1,

            target: targetText,
            status: statusLabel || "Uploaded SVG pair",

    var ft = document.getElementById("file-target-svg");

    doc.to = [];
    doc.blendShape = "paths";

    rows = rebuildRows();
    player.setDocument(doc, rows);
    player.restart();
    syncScrubMax();
    updateVectorPreviews();
    pushDocToTextarea();

  function pushDocToTextarea() {

      durationSec: doc.durationSec,
      midpointHoldSec: doc.midpointHoldSec,
      holdAfterSec: doc.holdAfterSec,
      ease: doc.ease,
      staggerSec: doc.staggerSec,
      blendShape:

            : "capsule",

    });

      null,

    );
  }

  function readSlidersToDoc() {
    doc.holdBeforeSec = parseFloat(document.getElementById("rng-hold").value);
    doc.durationSec = parseFloat(document.getElementById("rng-dur").value);
    doc.staggerSec = parseFloat(document.getElementById("rng-stag").value);
    doc.midpointHoldSec = parseFloat(document.getElementById("rng-mid").value);
    doc.holdAfterSec = parseFloat(document.getElementById("rng-hold-after").value);
    doc.ease = document.getElementById("sel-ease").value;
    player.speed = parseFloat(document.getElementById("rng-speed").value);
    player.loop = document.getElementById("chk-loop").checked;
    document.getElementById("val-speed").textContent =

    document.getElementById("val-hold").textContent = String(doc.holdBeforeSec);
    document.getElementById("val-dur").textContent = String(doc.durationSec);
    document.getElementById("val-stag").textContent = String(doc.staggerSec);
    document.getElementById("val-mid").textContent = String(
      doc.midpointHoldSec,
    );
    document.getElementById("val-hold-after").textContent = String(
      doc.holdAfterSec,
    );
  }

  function refreshFromSliders() {
    readSlidersToDoc();
    rows = rebuildRows();
    player.setDocument(doc, rows);
    player.seek(player.timeSec);
    syncScrubMax();
    updateVectorPreviews();
  }

  function applyTextareaJSON() {
    var raw = document.getElementById("json-doc").value;
    var parsed;
    try {
      parsed = JSON.parse(raw);
    } catch (e) {
      alert("That isn’t valid JSON. Check brackets, commas, or quotes.");
      return;
    }

      alert("This file isn’t a motion preset this tool can read.");
      return;
    }
    doc.v = parsed.v || "1";
    doc.meta = parsed.meta || {};
    doc.holdBeforeSec = parsed.holdBeforeSec != null ? parsed.holdBeforeSec : 0;
    doc.durationSec = parsed.durationSec != null ? parsed.durationSec : 1.18;
    doc.midpointHoldSec = parsed.midpointHoldSec || 0;
    doc.holdAfterSec =
      parsed.holdAfterSec != null ? parsed.holdAfterSec : 2;
    doc.ease = parsed.ease || "easeInOutCubic";
    doc.staggerSec =
      parsed.staggerSec != null ? parsed.staggerSec : doc.staggerSec;
    doc.blendShape =
      parsed.blendShape === "box"
        ? "box"
        : parsed.blendShape === "paths"
          ? "paths"
          : "capsule";
    doc.from = parsed.from || [];
    doc.to = parsed.to || [];

    document.getElementById("rng-hold").value = doc.holdBeforeSec;
    document.getElementById("rng-dur").value = doc.durationSec;
    document.getElementById("rng-stag").value = doc.staggerSec;
    document.getElementById("rng-mid").value = doc.midpointHoldSec;
    document.getElementById("rng-hold-after").value = doc.holdAfterSec;
    document.getElementById("sel-ease").value = doc.ease;

    rows = rebuildRows();
    player.setDocument(doc, rows);
    readSlidersToDoc();
    player.seek(0);
    syncScrubMax();
    updateVectorPreviews();
    syncCompBar();
    resetMotionUndoHistory();
  }

  document.getElementById("btn-play").addEventListener("click", function () {
    readSlidersToDoc();
    player.play();
  });
  document.getElementById("btn-pause").addEventListener("click", function () {
    player.pause();
  });
  document.getElementById("btn-restart").addEventListener("click", function () {
    player.pause();
    player.restart();
    syncScrubMax();
  });
  document.getElementById("chk-loop").addEventListener("change", function () {
    readSlidersToDoc();
    commitMotionUndoStep();
  });
  document.getElementById("rng-speed").addEventListener("input", function () {
    readSlidersToDoc();
  });
  document.getElementById("rng-speed").addEventListener("change", function () {
    commitMotionUndoStep();
  });
  ["rng-hold", "rng-dur", "rng-stag", "rng-mid", "rng-hold-after"].forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener("input", refreshFromSliders);
    el.addEventListener("change", commitMotionUndoStep);
  });
  document.getElementById("sel-ease").addEventListener("change", function () {
    doc.ease = this.value;
    player.seek(player.timeSec);
    commitMotionUndoStep();
  });

  rngScrub.addEventListener("pointerdown", function () {
    scrubbing = true;
    player.pause();
  });
  rngScrub.addEventListener("pointerup", function () {
    scrubbing = false;
    syncScrubMax();
  });
  rngScrub.addEventListener("input", function () {
    var sp = player.span();
    var t = (parseFloat(this.value) || 0) / 1000;
    player.seek(Math.min(t, sp));
    syncScrubMax();
  });
  rngScrub.addEventListener("change", function () {
    commitMotionUndoStep();
  });

  document.getElementById("sel-fps").addEventListener("change", function () {
    syncScrubMax();
    commitMotionUndoStep();
  });

  document.addEventListener("keydown", function (e) {
    var mod = e.metaKey || e.ctrlKey;
    if (mod && (e.key === "z" || e.key === "Z")) {
      var ae = document.activeElement;
      if (ae && ae.tagName === "TEXTAREA") return;
      if (
        ae &&
        ae.tagName === "INPUT" &&
        (ae.type === "text" ||
          ae.type === "search" ||
          ae.type === "email" ||
          ae.type === "url" ||
          ae.type === "password")
      ) {
        return;
      }
      if (e.shiftKey) {
        if (motionRedo()) e.preventDefault();
      } else {
        if (motionUndo()) e.preventDefault();
      }
      return;
    }
    if (mod && (e.key === "y" || e.key === "Y")) {
      var aeY = document.activeElement;
      if (aeY && aeY.tagName === "TEXTAREA") return;
      if (
        aeY &&
        aeY.tagName === "INPUT" &&
        (aeY.type === "text" ||
          aeY.type === "search" ||
          aeY.type === "email" ||
          aeY.type === "url" ||
          aeY.type === "password")
      ) {
        return;
      }
      if (motionRedo()) e.preventDefault();
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.code !== "Space") return;
    var a = document.activeElement;
    if (a && a.tagName === "SELECT") return;
    if (
      a &&
      (a.tagName === "TEXTAREA" ||
        (a.tagName === "INPUT" &&
          a.type !== "checkbox" &&
          a.type !== "button" &&
          a.type !== "radio" &&
          a.type !== "file"))
    ) {
      return;
    }
    e.preventDefault();
    readSlidersToDoc();
    if (player.isPlaying()) player.pause();
    else player.play();
  });
  document.getElementById("btn-apply").addEventListener("click", applyTextareaJSON);
  document.getElementById("btn-load-svg-pair").addEventListener("click", function () {
    var fs = document.getElementById("file-start-svg").files[0];
    var ft = document.getElementById("file-target-svg").files[0];
    if (!fs || !ft) {
      alert("Choose both SVG files first. Each file needs the same number of paths.");
      return;
    }
    var readerS = new FileReader();
    var readerT = new FileReader();
    var txtS = "";
    var txtT = "";
    var pending = 2;
    function tryApply() {
      pending -= 1;
      if (pending > 0) return;
      try {
        applySvgPair(txtS, txtT, fs.name + " + " + ft.name);
      } catch (e) {
        alert(e.message || String(e));
      }
    }
    readerS.onload = function () {
      txtS = String(readerS.result || "");
      tryApply();
    };
    readerT.onload = function () {
      txtT = String(readerT.result || "");
      tryApply();
    };
    readerS.readAsText(fs);
    readerT.readAsText(ft);
  });
  document.getElementById("btn-restore-bundled").addEventListener("click", restoreBundledSvgs);
  document.getElementById("btn-export").addEventListener("click", function () {
    readSlidersToDoc();
    rows = rebuildRows();
    pushDocToTextarea();
    updateVectorPreviews();
  });
  document.getElementById("btn-sample").addEventListener("click", function () {
    readSlidersToDoc();
    rows = rebuildRows();
    doc.from = rows.map(function (r) {
      return { cx: r.from.cx, cy: r.from.cy, w: r.from.w, h: r.from.h };
    });
    doc.to = rows.map(function (r) {
      return { cx: r.to.cx, cy: r.to.cy, w: r.to.w, h: r.to.h };
    });
    pushDocToTextarea();
    player.setDocument(doc, rows);
    player.seek(player.timeSec);
    syncScrubMax();
    updateVectorPreviews();
    resetMotionUndoHistory();
  });

  readSlidersToDoc();
  if (!tryRestoreStoredSvgPair()) {
    player.seek(0);
    pushDocToTextarea();
    syncScrubMax();
    updateVectorPreviews();
    syncCompBar();
  }
  resetMotionUndoHistory();
})();
</script>
</body>
</html>
